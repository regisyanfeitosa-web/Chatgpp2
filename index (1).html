<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChatGPP</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' rx='56' fill='%2310A37F'/><g transform='translate(128,128) scale(1.1)' stroke='%23FFF' stroke-width='9' stroke-linecap='round' fill='none'><path d='M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14'/><path d='M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14' transform='rotate(60)'/><path d='M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14' transform='rotate(120)'/><path d='M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14' transform='rotate(180)'/><path d='M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14' transform='rotate(240)'/><path d='M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14' transform='rotate(300)'/></g></svg>">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-card: #2f2f2f;
      --bg-input: #2f2f2f;
      --text-main: #ececec;
      --text-muted: #b4b4b4;
      --border-color: rgba(255, 255, 255, 0.15);
      --accent: #10a37f;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
    .app-container { display: flex; width: 100vw; height: 100vh; position: relative; }

    /* Sidebar */
    .sidebar { width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; padding: 12px; transition: transform 0.25s ease; z-index: 30; height: 100%; }
    .new-chat-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; width: 100%; }
    .history-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin: 16px 8px 8px 8px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item { padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; color: var(--text-main); display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.08); }
    .overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); z-index: 20; }

    /* Area Principal */
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
    .topbar { height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: var(--bg-main); }
    .menu-toggle { background: transparent; border: none; color: var(--text-main); font-size: 1.4rem; cursor: pointer; padding: 6px; }
    .model-selector { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

    .messages-container { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; }
    .message-wrapper { width: 100%; max-width: 768px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
    .message-wrapper.user { align-items: flex-end; }
    .message-wrapper.bot { align-items: flex-start; }
    .author-name { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .message-bubble { max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .message-wrapper.user .message-bubble { background-color: var(--bg-card); color: var(--text-main); border-top-right-radius: 4px; }
    .message-wrapper.bot .message-bubble { background-color: transparent; color: var(--text-main); padding-left: 0; padding-right: 0; max-width: 100%; }

    .generated-img { max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border-color); display: block; }

    .input-area { padding: 12px 16px 20px 16px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, rgba(33, 33, 33, 0) 0%, var(--bg-main) 40%); }
    .input-box { width: 100%; max-width: 768px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 24px; padding: 10px 12px 10px 18px; display: flex; align-items: flex-end; gap: 8px; }
    textarea { flex: 1; background: transparent; border: none; color: var(--text-main); resize: none; outline: none; height: 24px; max-height: 160px; font-size: 0.95rem; line-height: 1.4; }
    textarea::placeholder { color: var(--text-muted); }
    .send-btn { background-color: #ffffff; color: #000000; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:disabled { background-color: #676767; color: #2f2f2f; cursor: not-allowed; }

    @media (max-width: 768px) {
      .sidebar { position: absolute; top: 0; left: 0; bottom: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar.open + .overlay { display: block; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" onclick="startNewChat()">
        <i class="ph ph-plus"></i> Novo chat
      </button>

      <div class="history-title">Conversas</div>
      <div class="history-list">
        <div class="history-item">
          <i class="ph ph-chat-teardrop-text"></i> ChatGPP (Texto + Imagem)
        </div>
      </div>
    </aside>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <main class="chat-area">
      <header class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <i class="ph ph-list"></i>
        </button>
        <div class="model-selector">
          <svg width="20" height="20" viewBox="0 0 256 256" fill="none"><rect width="256" height="256" rx="56" fill="#10A37F"/><g transform="translate(128,128) scale(1.1)" stroke="#FFF" stroke-width="9" stroke-linecap="round" fill="none"><path d="M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14"/><path d="M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14" transform="rotate(60)"/><path d="M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14" transform="rotate(120)"/><path d="M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14" transform="rotate(180)"/><path d="M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14" transform="rotate(240)"/><path d="M0 -50 C 25 -50 45 -30 45 -5 C 45 15 25 35 0 35 C -15 35 -28 26 -35 14" transform="rotate(300)"/></g></svg>
          ChatGPP <span>Livre</span>
        </div>
        <div style="width:24px;"></div>
      </header>

      <div class="messages-container" id="messagesContainer">
        <div class="message-wrapper bot">
          <div class="author-name">
            <i class="ph ph-sparkle" style="color: var(--accent);"></i> ChatGPP
          </div>
          <div class="message-bubble">
            Olá! Sou o ChatGPP. Posso responder suas dúvidas de texto e **gerar imagens**!
            
Para criar uma imagem, diga algo como: *"Crie uma imagem de um dragão azul"*.
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="userInput" rows="1" placeholder="Envie uma mensagem ou peça uma imagem..." oninput="adjustTextareaHeight(this)" onkeydown="handleKeyPress(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <i class="ph ph-arrow-up" style="font-size: 1.2rem; font-weight: bold;"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    let conversationHistory = [
      { role: 'system', content: 'Você é o ChatGPP, um assistente inteligente, preciso e prestativo. Responda em Português do Brasil com clareza e sem erros.' }
    ];

    userInput.addEventListener('input', function() {
      sendBtn.disabled = this.value.trim() === '';
    });

    function adjustTextareaHeight(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function toggleSidebar() { sidebar.classList.toggle('open'); }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (userInput.value.trim() !== '') sendMessage();
      }
    }

    function isImagePrompt(text) {
      const lower = text.toLowerCase();
      return lower.includes('crie uma imagem') || 
             lower.includes('gere uma imagem') || 
             lower.includes('desenhe') || 
             lower.includes('faça uma imagem') ||
             lower.includes('imagem de');
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      userInput.value = '';
      userInput.style.height = '24px';
      sendBtn.disabled = true;

      // Verifica se o usuário pediu uma IMAGEM
      if (isImagePrompt(text)) {
        const loadingId = appendMessage("Gerando sua imagem, aguarde...", 'bot');
        try {
          const cleanPrompt = encodeURIComponent(text);
          const imgUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;
          
          const imgHTML = `Aqui está a sua imagem:<br><img src="${imgUrl}" class="generated-img" alt="Imagem gerada" onload="scrollToBottom()">`;
          updateMessage(loadingId, imgHTML, true);
        } catch (err) {
          updateMessage(loadingId, "Erro ao gerar a imagem. Tente novamente.");
        }
        return;
      }

      // Requisição de TEXTO (Llama 3 / OpenAI via backend Pollinations)
      const loadingId = appendMessage("Pensando...", 'bot');
      conversationHistory.push({ role: 'user', content: text });

      try {
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversationHistory,
            model: 'openai'
          })
        });

        if (response.ok) {
          const reply = await response.text();
          conversationHistory.push({ role: 'assistant', content: reply });
          updateMessage(loadingId, reply);
        } else {
          updateMessage(loadingId, "Não foi possível obter uma resposta agora. Tente novamente em breve.");
        }
      } catch (err) {
        updateMessage(loadingId, "Erro de conexão. Verifique sua internet.");
      }
    }

    function appendMessage(text, type) {
      const wrapper = document.createElement('div');
      const msgId = 'msg-' + Date.now();
      wrapper.className = `message-wrapper ${type}`;
      wrapper.id = msgId;

      if (type === 'user') {
        wrapper.innerHTML = `<div class="message-bubble">${escapeHTML(text)}</div>`;
      } else {
        wrapper.innerHTML = `
          <div class="author-name">
            <i class="ph ph-sparkle" style="color: var(--accent);"></i> ChatGPP
          </div>
          <div class="message-bubble">${escapeHTML(text)}</div>
        `;
      }

      messagesContainer.appendChild(wrapper);
      scrollToBottom();
      return msgId;
    }

    function updateMessage(id, newText, isHTML = false) {
      const msgElem = document.getElementById(id);
      if (msgElem) {
        const bubble = msgElem.querySelector('.message-bubble');
        if (isHTML) {
          bubble.innerHTML = newText;
        } else {
          bubble.innerText = newText;
        }
        scrollToBottom();
      }
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function startNewChat() {
      conversationHistory = [
        { role: 'system', content: 'Você é o ChatGPP, um assistente inteligente, preciso e prestativo. Responda em Português do Brasil com clareza e sem erros.' }
      ];
      messagesContainer.innerHTML = `
        <div class="message-wrapper bot">
          <div class="author-name">
            <i class="ph ph-sparkle" style="color: var(--accent);"></i> ChatGPP
          </div>
          <div class="message-bubble">
            Sessão reiniciada! Como posso ajudar você agora?
          </div>
        </div>
      `;
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
